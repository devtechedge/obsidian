<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Obsidian Archive</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<!-- Google Fonts: Inter Variable -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />

<!-- Tailwind CSS Play CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { inter: ['Inter', 'sans-serif'] },
      screens: {
        xs: '425px',
      },
      colors: {
        gallery: { DEFAULT: '#f4f3ef', dark: '#e8e7e3', light: '#faf9f6' },
        accent: { DEFAULT: '#dc2626', hover: '#ef4444', deep: '#991b1b' }
      }
    }
  }
}
</script>

<!-- React 18 UMD -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Lenis Smooth Scroll -->
<script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>

<!-- Three.js (UMD, module-free) -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: auto;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    max-width: 100vw;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow-x: hidden;
    max-width: 100vw;
    cursor: none;
    transition: background-color 0.6s ease, color 0.6s ease;
  }

  /* ── Theme Variables ── */
  :root {
    --bg-primary: #f4f3ef;
    --bg-secondary: #e8e7e3;
    --bg-overlay: rgba(244, 243, 239, 0.9);
    --text-primary: #171717;
    --text-secondary: #525252;
    --text-muted: #737373;
    --text-faint: #a3a3a3;
    --text-ghost: #d4d4d4;
    --border-color: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.14);
    --pattern-fill: #e8e7e3;
    --overlay-grad: rgba(23,23,23,0.85);
    --overlay-soft: rgba(23,23,23,0.4);
    --overlay-text: #f5f5f5;
    --scrollbar-track: #f4f3ef;
    --scrollbar-thumb: #c4c3bf;
  }

  body.theme-dark {
    --bg-primary: #0a0a0a;
    --bg-secondary: #141414;
    --bg-overlay: rgba(10, 10, 10, 0.9);
    --text-primary: #f5f5f5;
    --text-secondary: #a3a3a3;
    --text-muted: #737373;
    --text-faint: #525252;
    --text-ghost: #2a2a2a;
    --border-color: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --pattern-fill: #141414;
    --overlay-grad: rgba(10,10,10,0.85);
    --overlay-soft: rgba(10,10,10,0.4);
    --overlay-text: #f5f5f5;
    --scrollbar-track: #0a0a0a;
    --scrollbar-thumb: #2a2a2a;
  }

  /* ── Hero Canvas (2D particles) ── */
  #heroCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Hero WebGL Crystal ── */
  #heroCrystal {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: auto;
    z-index: 1;
  }

  /* ── Preloader ── */
  #preloader {
    position: fixed;
    inset: 0;
    z-index: 100000;
    background: var(--bg-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1),
                visibility 0.8s cubic-bezier(0.16,1,0.3,1);
  }

  #preloader.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .preloader-logo {
    width: 80px;
    height: 80px;
    margin-bottom: 40px;
    animation: logoFloat 2s ease-in-out infinite;
  }

  @keyframes logoFloat {
    0%, 100% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.1); }
  }

  .preloader-logo svg {
    width: 100%;
    height: 100%;
  }

  .preloader-logo polygon, .preloader-logo rect {
    animation: logoPulse 1.5s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes logoPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .preloader-text {
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .preloader-progress {
    width: 200px;
    height: 1px;
    background: var(--border-strong);
    position: relative;
    overflow: hidden;
  }

  .preloader-progress-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: #dc2626;
    width: 0%;
    transition: width 0.2s ease;
  }

  .preloader-percentage {
    margin-top: 16px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* ── Scroll Progress Bar ── */
  #scrollProgressBar {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    background: #dc2626;
    z-index: 99997;
    width: 0%;
    transition: width 0.05s linear;
  }

  /* ── Scroll Progress Ring ── */
  #scrollProgressRing {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    z-index: 99997;
    pointer-events: none;
  }

  #scrollProgressRing svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  #scrollProgressRing .ring-bg {
    fill: none;
    stroke: var(--border-strong);
    stroke-width: 2;
  }

  #scrollProgressRing .ring-fg {
    fill: none;
    stroke: #dc2626;
    stroke-width: 2;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.1s linear;
  }

  #scrollProgressRing .ring-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  /* ── Theme Toggle ── */
  #themeToggle {
    position: fixed;
    bottom: 24px;
    left: 24px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--bg-overlay);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;
    z-index: 99997;
    transition: all 0.3s ease;
    pointer-events: auto;
  }

  #themeToggle:hover {
    border-color: #dc2626;
    transform: scale(1.05);
  }

  #themeToggle svg {
    width: 20px;
    height: 20px;
    stroke: var(--text-primary);
    transition: opacity 0.3s ease, transform 0.4s ease;
  }

  #themeToggle .sun-icon { display: none; }
  #themeToggle .moon-icon { display: block; }
  body.theme-dark #themeToggle .sun-icon { display: block; }
  body.theme-dark #themeToggle .moon-icon { display: none; }

  /* ── Cursor Trail Canvas ── */
  #cursorTrail {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99997;
    mix-blend-mode: multiply;
  }

  body.theme-dark #cursorTrail {
    mix-blend-mode: screen;
  }

  /* ── Particle Burst Canvas ── */
  #burstCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99996;
  }

  /* ── Lightbox Modal ── */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 99995;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s ease;
    padding: 80px 40px;
  }

  #lightbox.open {
    opacity: 1;
    visibility: visible;
  }

  .lightbox-content {
    max-width: 1000px;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    transform: scale(0.92);
    transition: transform 0.5s cubic-bezier(0.16,1,0.3,1);
  }

  #lightbox.open .lightbox-content {
    transform: scale(1);
  }

  .lightbox-image {
    background: #e8e7e3;
    aspect-ratio: 4/3;
    border-radius: 4px;
    overflow: hidden;
  }

  .lightbox-image svg {
    width: 100%;
    height: 100%;
  }

  .lightbox-meta {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .lightbox-title {
    font-size: clamp(1.75rem, 4vw, 2.75rem);
    font-weight: 700;
    color: #f5f5f5;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .lightbox-category {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #dc2626;
    margin-bottom: 12px;
  }

  .lightbox-description {
    color: #a3a3a3;
    margin-top: 12px;
    max-width: 560px;
    line-height: 1.6;
  }

  .lightbox-nav {
    display: flex;
    gap: 12px;
  }

  .lightbox-nav button {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    color: #f5f5f5;
    cursor: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .lightbox-nav button:hover {
    background: #dc2626;
    border-color: #dc2626;
  }

  .lightbox-close {
    position: absolute;
    top: 24px;
    right: 24px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    color: #f5f5f5;
    cursor: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .lightbox-close:hover {
    background: #dc2626;
    border-color: #dc2626;
    transform: rotate(90deg);
  }

  .lightbox-counter {
    position: absolute;
    top: 32px;
    left: 32px;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #737373;
    font-variant-numeric: tabular-nums;
  }

  /* ── Nav active link ── */
  .nav-link.active {
    color: var(--text-primary) !important;
  }

  .nav-link.active::after {
    width: 100% !important;
    background: #dc2626;
  }

  /* ── GLSL Liquid Distortion hover ── */
  .grid-item-webgl {
    position: relative;
    overflow: hidden;
    border-radius: 4px;
  }

  .grid-item-webgl canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .grid-item-webgl .grid-fallback {
    width: 100%;
    height: 100%;
  }

  /* ── Custom Cursor ── */
  .cursor-dot {
    width: 8px; height: 8px;
    background: #dc2626;
    border-radius: 50%;
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width 0.3s cubic-bezier(0.25,1,0.5,1),
                height 0.3s cubic-bezier(0.25,1,0.5,1),
                background 0.3s ease;
  }

  .cursor-ring {
    width: 40px; height: 40px;
    border: 1.5px solid rgba(220,38,38,0.4);
    border-radius: 50%;
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 99998;
    transform: translate(-50%, -50%);
    transition: width 0.4s cubic-bezier(0.25,1,0.5,1),
                height 0.4s cubic-bezier(0.25,1,0.5,1),
                border-color 0.3s ease,
                background 0.3s ease;
  }

  .cursor-dot.hovering {
    width: 16px; height: 16px;
    background: #dc2626;
  }

  .cursor-ring.hovering {
    width: 60px; height: 60px;
    border-color: rgba(220,38,38,0.25);
    background: rgba(220,38,38,0.04);
  }

  /* ── Selection ── */
  ::selection {
    background: rgba(220,38,38,0.2);
    color: #171717;
  }

  /* ── Scroll Reveal Animations ── */
  .reveal {
    opacity: 0;
    transform: translateY(60px);
    transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .reveal-left {
    opacity: 0;
    transform: translateX(-80px);
    transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .reveal-left.visible {
    opacity: 1;
    transform: translateX(0);
  }

  .reveal-right {
    opacity: 0;
    transform: translateX(80px);
    transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .reveal-right.visible {
    opacity: 1;
    transform: translateX(0);
  }

  .reveal-scale {
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .reveal-scale.visible {
    opacity: 1;
    transform: scale(1);
  }

  /* Stagger children */
  .stagger-children .reveal:nth-child(1) { transition-delay: 0ms; }
  .stagger-children .reveal:nth-child(2) { transition-delay: 100ms; }
  .stagger-children .reveal:nth-child(3) { transition-delay: 200ms; }
  .stagger-children .reveal:nth-child(4) { transition-delay: 300ms; }
  .stagger-children .reveal:nth-child(5) { transition-delay: 400ms; }
  .stagger-children .reveal:nth-child(6) { transition-delay: 500ms; }

  /* ── Magnetic Button ── */
  .magnetic-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s cubic-bezier(0.25,1,0.5,1);
  }

  .magnetic-btn::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: inherit;
    background: rgba(220,38,38,0.0);
    transition: background 0.3s ease;
  }

  .magnetic-btn:hover::after {
    background: rgba(220,38,38,0.06);
  }

  /* ── Grid Item Hover ── */
  .grid-item-img {
    transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                filter 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .grid-item:hover .grid-item-img {
    transform: scale(1.08);
    filter: brightness(1.05) saturate(1.1);
  }

  .grid-item-overlay {
    opacity: 0;
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .grid-item:hover .grid-item-overlay {
    opacity: 1;
  }

  /* ── Hero Line Animation ── */
  @keyframes lineExpand {
    from { width: 0; }
    to { width: 100%; }
  }

  .hero-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, #dc2626, transparent);
    animation: lineExpand 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.8s;
    width: 0;
  }

  /* ── Floating Particles ── */
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
    50% { transform: translateY(-30px) rotate(180deg); opacity: 0.5; }
  }

  .particle {
    position: absolute;
    width: 2px; height: 2px;
    background: #dc2626;
    border-radius: 50%;
    animation: float 6s ease-in-out infinite;
  }

  /* ── Marquee ── */
  @keyframes marquee {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .marquee-track {
    animation: marquee 30s linear infinite;
  }

  /* ── Nav link underline ── */
  .nav-link {
    position: relative;
  }

  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 1px;
    background: #dc2626;
    transition: width 0.3s cubic-bezier(0.25,1,0.5,1);
  }

  .nav-link:hover::after {
    width: 100%;
  }

  /* ── Touch device overrides ── */
  @media (hover: none) and (pointer: coarse) {
    body { cursor: auto; }
    .cursor-dot, .cursor-ring { display: none !important; }
    .grid-item-overlay { opacity: 1; }
  }

  /* ── Noise overlay (lighter for light mode) ── */
  .noise-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.018;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }

  /* ── Number counter ── */
  .stat-number {
    font-variant-numeric: tabular-nums;
  }

  /* ── SVG Pattern Containers ── */
  .pattern-container {
    overflow: hidden;
    border-radius: 4px;
  }

  /* ── Responsive Typography ── */
  .hero-title {
    font-size: clamp(3.5rem, 12vw, 10rem);
    line-height: 0.9;
    letter-spacing: -0.04em;
    font-weight: 800;
  }

  .section-title {
    font-size: clamp(2rem, 6vw, 5rem);
    line-height: 1;
    letter-spacing: -0.03em;
    font-weight: 700;
  }

  .body-large {
    font-size: clamp(1rem, 2vw, 1.25rem);
    line-height: 1.7;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #dc2626; }

  /* ── Touch device additions ── */
  @media (hover: none) and (pointer: coarse) {
    #themeToggle, #scrollProgressRing { cursor: pointer; }
    #cursorTrail, #burstCanvas { display: none; }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ════════════════════════════════════════════════════════════════
     FEATURE 11: PINNED HORIZONTAL-SCROLL GALLERY
     ════════════════════════════════════════════════════════════════ */
  .horizontal-section {
    position: relative;
    height: 400vh; /* tall so we have scroll runway */
  }
  .horizontal-pin {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  .horizontal-track {
    display: flex;
    gap: 2rem;
    padding: 0 6rem;
    will-change: transform;
    transition: transform 0.05s linear;
  }
  .horizontal-panel {
    flex: 0 0 auto;
    width: 70vw;
    max-width: 720px;
    aspect-ratio: 4 / 3;
    position: relative;
    border: 1px solid var(--border-color);
    overflow: hidden;
    border-radius: 2px;
    background: var(--bg-secondary);
  }
  .horizontal-panel .panel-meta {
    position: absolute;
    bottom: 1.5rem;
    left: 1.5rem;
    right: 1.5rem;
    z-index: 2;
    color: var(--overlay-text);
  }
  .horizontal-panel .panel-num {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    z-index: 2;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--overlay-text);
    opacity: 0.7;
  }
  .horizontal-progress-track {
    position: absolute;
    bottom: 3rem;
    left: 50%;
    transform: translateX(-50%);
    width: 12rem;
    height: 1px;
    background: var(--border-strong);
    overflow: hidden;
    z-index: 3;
  }
  .horizontal-progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.1s linear;
  }
  .horizontal-heading {
    position: absolute;
    top: 6rem;
    left: 6rem;
    z-index: 3;
    pointer-events: none;
  }
  @media (max-width: 768px) {
    .horizontal-panel { width: 80vw; }
    .horizontal-track { padding: 0 1.5rem; gap: 1rem; }
    .horizontal-heading { top: 2rem; left: 1.5rem; }
  }

  /* ════════════════════════════════════════════════════════════════
     FEATURE 12: AUDIO TOGGLE BUTTON
     ════════════════════════════════════════════════════════════════ */
  #audioToggle {
    position: fixed;
    bottom: 1.5rem;
    left: 1.5rem;
    z-index: 999;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: var(--bg-overlay);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;
    transition: all 0.3s ease;
    opacity: 0;
    transform: translateY(20px);
    pointer-events: none;
  }
  #audioToggle.ready { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #audioToggle:hover { border-color: var(--accent); color: var(--accent); }
  #audioToggle.playing { border-color: var(--accent); color: var(--accent); }
  #audioToggle .audio-wave {
    display: flex;
    gap: 2px;
    align-items: center;
    height: 14px;
  }
  #audioToggle .audio-wave span {
    width: 2px;
    background: currentColor;
    height: 4px;
    border-radius: 1px;
    transition: height 0.2s ease;
  }
  #audioToggle.playing .audio-wave span {
    animation: audioWave 1.2s ease-in-out infinite;
  }
  #audioToggle.playing .audio-wave span:nth-child(1) { animation-delay: 0s; }
  #audioToggle.playing .audio-wave span:nth-child(2) { animation-delay: 0.15s; }
  #audioToggle.playing .audio-wave span:nth-child(3) { animation-delay: 0.3s; }
  #audioToggle.playing .audio-wave span:nth-child(4) { animation-delay: 0.45s; }
  @keyframes audioWave {
    0%, 100% { height: 4px; }
    50% { height: 14px; }
  }

  /* ════════════════════════════════════════════════════════════════
     FEATURE 13: KONAMI CODE OVERLAY
     ════════════════════════════════════════════════════════════════ */
  #konamiOverlay {
    position: fixed;
    inset: 0;
    z-index: 10000;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease;
    overflow: hidden;
  }
  #konamiOverlay.active { opacity: 1; pointer-events: auto; }
  #konamiOverlay::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(220,38,38,0.15), rgba(10,10,10,0.85));
    backdrop-filter: blur(2px);
  }
  #konamiMessage {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    color: #fff;
    text-align: center;
    z-index: 2;
    transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.4);
    opacity: 0;
  }
  #konamiOverlay.active #konamiMessage {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  #konamiMessage .km-eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    color: #dc2626;
    margin-bottom: 1rem;
    text-transform: uppercase;
  }
  #konamiMessage .km-title {
    font-size: clamp(2rem, 6vw, 4.5rem);
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  #konamiMessage .km-sub {
    margin-top: 1rem;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    color: #a3a3a3;
    text-transform: uppercase;
  }
  .konami-particle {
    position: absolute;
    pointer-events: none;
    will-change: transform, opacity;
  }

  /* ════════════════════════════════════════════════════════════════
     FEATURE 14: CURSOR-REACTIVE TEXT DISTORTION
     ════════════════════════════════════════════════════════════════ */
  [data-distort] .distort-char {
    display: inline-block;
    transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2), color 0.4s ease;
    will-change: transform;
  }
  [data-distort] .distort-char.distort-active {
    color: var(--accent);
  }

  /* ════════════════════════════════════════════════════════════════
     FEATURE 15: LIVE-DRAWING SVG MANDALA
     ════════════════════════════════════════════════════════════════ */
  .mandala-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mandala-bg svg {
    width: 100%;
    height: 100%;
    max-width: 800px;
    max-height: 800px;
  }
  .mandala-stroke {
    fill: none;
    stroke: var(--accent);
    stroke-width: 0.5;
    opacity: 0.35;
    stroke-dasharray: var(--len, 1000);
    stroke-dashoffset: var(--len, 1000);
    transition: stroke-dashoffset 2.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .mandala-bg.drawn .mandala-stroke {
    stroke-dashoffset: 0;
  }

  /* ════════════════════════════════════════════════════════════════
     FEATURE 16: 3D PERSPECTIVE TILT CARD
     ════════════════════════════════════════════════════════════════ */
  .tilt-3d-wrap {
    perspective: 1200px;
    transform-style: preserve-3d;
  }
  .tilt-3d-card {
    transform-style: preserve-3d;
    transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    will-change: transform;
    position: relative;
  }
  .tilt-3d-card .tilt-layer {
    transform-style: preserve-3d;
    transition: transform 0.2s ease;
  }
  .tilt-3d-card .tilt-layer-1 { transform: translateZ(30px); }
  .tilt-3d-card .tilt-layer-2 { transform: translateZ(60px); }
  .tilt-3d-card .tilt-shine {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.18), transparent 50%);
    mix-blend-mode: overlay;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 5;
  }
  .tilt-3d-card:hover .tilt-shine { opacity: 1; }

  /* ════════════════════════════════════════════════════════════════
     FEATURE 17: WORD-BY-WORD REVEAL
     ════════════════════════════════════════════════════════════════ */
  .word-reveal .word {
    display: inline-block;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    margin-right: 0.25em;
  }
  .word-reveal.revealed .word {
    opacity: 1;
    transform: translateY(0);
  }

  /* ════════════════════════════════════════════════════════════════
     FEATURE 18: FOOTER LIVE CLOCK
     ════════════════════════════════════════════════════════════════ */
  .footer-clock {
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.1em;
    font-size: 0.7rem;
    text-transform: uppercase;
  }
  .footer-greeting {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.25rem;
  }

  /* ════════════════════════════════════════════════════════════════
     FEATURE 19: COMMAND PALETTE
     ════════════════════════════════════════════════════════════════ */
  #commandPalette {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(10,10,10,0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 12vh;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #commandPalette.open { opacity: 1; pointer-events: auto; }
  .cmdk-box {
    width: min(640px, 92vw);
    background: var(--bg-primary);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.25);
    overflow: hidden;
    transform: translateY(-12px) scale(0.98);
    transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.1);
  }
  #commandPalette.open .cmdk-box { transform: translateY(0) scale(1); }
  .cmdk-input-wrap {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border-color);
  }
  .cmdk-input-wrap svg { color: var(--text-faint); flex-shrink: 0; }
  .cmdk-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 1rem;
    font-family: inherit;
  }
  .cmdk-input::placeholder { color: var(--text-faint); }
  .cmdk-kbd {
    font-size: 0.65rem;
    padding: 0.2rem 0.45rem;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    color: var(--text-faint);
    letter-spacing: 0.05em;
  }
  .cmdk-list {
    max-height: 360px;
    overflow-y: auto;
    padding: 0.5rem;
  }
  .cmdk-group-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-faint);
    padding: 0.75rem 0.75rem 0.4rem;
  }
  .cmdk-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.7rem 0.75rem;
    border-radius: 4px;
    cursor: none;
    transition: background 0.15s ease;
    color: var(--text-secondary);
    font-size: 0.9rem;
  }
  .cmdk-item.active {
    background: var(--bg-secondary);
    color: var(--text-primary);
  }
  .cmdk-item-icon {
    width: 28px;
    height: 28px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--text-muted);
  }
  .cmdk-item.active .cmdk-item-icon { border-color: var(--accent); color: var(--accent); }
  .cmdk-item-meta {
    margin-left: auto;
    font-size: 0.65rem;
    color: var(--text-faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .cmdk-footer {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    padding: 0.65rem 1rem;
    border-top: 1px solid var(--border-color);
    font-size: 0.65rem;
    color: var(--text-faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .cmdk-footer span { display: flex; align-items: center; gap: 0.35rem; }
  .cmdk-footer kbd {
    font-family: inherit;
    padding: 0.1rem 0.35rem;
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    font-size: 0.6rem;
  }
  .cmdk-trigger {
    position: fixed;
    bottom: 1.5rem;
    right: 5rem;
    z-index: 999;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 0.85rem;
    border: 1px solid var(--border-strong);
    background: var(--bg-overlay);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--text-muted);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-radius: 6px;
    cursor: none;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s ease;
    pointer-events: none;
  }
  .cmdk-trigger.ready { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .cmdk-trigger:hover { border-color: var(--accent); color: var(--accent); }
  .cmdk-trigger kbd {
    font-family: inherit;
    padding: 0.1rem 0.35rem;
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    font-size: 0.6rem;
  }
  @media (max-width: 640px) {
    .cmdk-trigger { display: none; }
  }

  /* ════════════════════════════════════════════════════════════════
     FEATURE 20: SCROLL-VELOCITY MOTION BLUR
     ════════════════════════════════════════════════════════════════ */
  [data-scroll-blur] {
    transition: filter 0.3s ease, transform 0.3s ease;
    will-change: filter, transform;
  }
  [data-scroll-blur].velocity-active {
    filter: blur(var(--blur-px, 2px));
    transform: scaleY(0.985);
  }

  /* ════════════════════════════════════════════════════════════════
     MOBILE MENU — full-screen overlay, fadeIn stagger for items
     ════════════════════════════════════════════════════════════════ */
  @keyframes mobileMenuFadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Hide floating UI buttons on small screens to reduce clutter */
  @media (max-width: 640px) {
    #audioToggle { display: none !important; }
    #cmdkTrigger { display: none !important; }
    /* Make scroll progress ring smaller and less intrusive on mobile */
    #scrollProgressRing {
      width: 36px !important;
      height: 36px !important;
      bottom: 1rem !important;
      right: 1rem !important;
    }
    #scrollProgressRing svg { width: 36px; height: 36px; }
    #scrollProgressRing .ring-text { font-size: 8px !important; }
  }
</style>
</head>
